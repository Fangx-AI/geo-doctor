# 每月检查一次文档里的外部链接。平台文档经常改地址，失效的链接会自动开一个 Issue。
# 已有同类 Issue 还没关时，改为在那个 Issue 下追加一次结果，不每月新建重复条目。
name: link-check
on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 这个检查只回答一个问题：有没有打不开的链接。下面这些情况不算打不开：
      # - robots.txt：4xx / 405 / 307 本身就是数据，docs/ai-crawler-leaderboard.md
      #   脚注 ¹ 把"没有 robots.txt"按 RFC 9309 视为不限制。而且同一地址对不同客户端
      #   返回不同状态（2026-11-16 核验：byd.com 对 lychee 报 404，普通 GET 返回
      #   200 + text/plain），它不能当链接有效性信号用。
      # - player.vimeo.com：401 是 embed 域名限制，视频只在原文页面里播放。
      # - webflow.com 这两篇：页面本身返回 200（2026-11-16 核验），lychee 报的
      #   HTTP/2 protocol error 是它的 HTTP 客户端与该站 HTTP/2 实现的兼容问题。
      #
      # --accept-timeouts：超时不等于死链。打开后请求超时按通过处理，真正的 404 / 5xx
      # 仍然会让这次检查失败。加它是因为 nlp.stanford.edu（docs/basics.md 引的
      # 《Introduction to Information Retrieval》官方站）：2026-11-16 在 runner 上
      # 30 秒和 60 秒都超时，两个第三方代理取也返回 520/522，但 Wayback 在 2026-08-19
      # 还抓到 200 —— 站点在，是这类网络到不了它。把整个域名 exclude 会连它真的变 404
      # 也一起放过；按超时处理才是准的。
      #
      # --max-retries / --retry-wait-time：lychee 默认重试间隔只有 1 秒。中文站点
      # （虎嗅、36 氪这类）偶尔对境外 IP 回 502，隔几秒再看就正常（2026-11-16 核验：
      # huxiu.com 某篇文章 runner 报 502，同一分钟本机 GET 两次都是 200）。重试 4 次、
      # 间隔 5 秒，让偶发 5xx 自己过去，而不是每月报一次、点开又查无此事。
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --timeout 30 --accept 200,206,403,429
            --accept-timeouts
            --max-retries 4 --retry-wait-time 5
            --exclude 'robots\.txt$'
            --exclude '^https://player\.vimeo\.com/'
            --exclude '^https://webflow\.com/blog/landing-pages-vs-websites$'
            --exclude '^https://webflow\.com/blog/ai-design-tools$'
            './**/*.md'
          output: ./lychee/out.md
          fail: false
      - name: Find an open link-check issue
        id: existing
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --label links --state open --limit 1 --json number --jq '.[0].number // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Open a new issue
        if: steps.lychee.outputs.exit_code != 0 && steps.existing.outputs.number == ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 外部链接检查：发现失效链接
          content-filepath: ./lychee/out.md
          labels: links
      - name: Append the result to the open issue
        if: steps.lychee.outputs.exit_code != 0 && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.existing.outputs.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file ./lychee/out.md
